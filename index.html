<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoolball</title>
<meta name="description" content="Stoolball, the old Sussex bat-and-ball game, in pixel art. Bat an innings, bowl at a village side, or play the whole match on a summer evening.">
<meta property="og:title" content="Stoolball">
<meta property="og:description" content="The old Sussex bat-and-ball game in pixel art. Bat, bowl, or play the whole match on a summer evening.">
<meta property="og:image" content="assets/title.png">
<meta name="theme-color" content="#10171a">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="sub">SUSSEX &middot; MIXED LEAGUE &middot; TUESDAY EVENING</div>
    <h1>Stool<em>ball</em></h1>
    <p class="tagline">A village evening, side on. Bat an innings, bowl one at them, or play the whole match.</p>
  </header>

  <section id="title" hidden>
    <button id="title-go" class="title-go" type="button" aria-label="Start">
      <img id="title-art" src="assets/title.png" width="320" height="180" alt="Stoolball: a paddle bat and ball in the grass by the wicket board, at sunset">
    </button>
    <p class="press">Click, tap or press Space</p>
  </section>

  <section id="setup">
    <fieldset>
      <legend>WHAT ARE YOU PLAYING</legend>
      <div class="choices" id="modes"></div>
    </fieldset>
    <fieldset>
      <legend>HOW LONG AN INNINGS</legend>
      <div class="choices" id="lengths"></div>
    </fieldset>
    <div class="how" id="how"></div>
    <div class="row">
      <button id="btn-start" class="primary" type="button">Play</button>
      <button id="btn-sheet" type="button" hidden>Sprite list</button>
    </div>
  </section>

  <section id="match" hidden>
    <div class="hud" id="hud"></div>
    <div id="stage"><canvas id="screen" width="320" height="180" aria-label="Stoolball pitch, side on"></canvas></div>
    <div class="call" id="call"></div>
    <div class="book"><span class="lab">THIS OVER</span><div class="balls" id="balls"></div></div>
    <div class="row">
      <button id="btn-act" class="primary" type="button">Swing</button>
      <button id="btn-card" type="button">Scorecard</button>
      <button id="btn-full" type="button">Full screen</button>
      <button id="btn-quit" type="button">Declare</button>
    </div>
  </section>

  <section id="card" hidden>
    <div class="done-inner">
      <h2 id="card-title">Scorecard</h2>
      <div class="figs" id="card-figs"></div>
      <div class="scroll"><table id="card-bat"></table></div>
      <p class="verdict" id="card-extra"></p>
      <div class="scroll"><table id="card-bowl"></table></div>
      <div class="row">
        <button id="btn-back" class="primary" type="button">Back</button>
      </div>
    </div>
  </section>

  <section id="sheet" hidden>
    <div class="done-inner">
      <h2>Sprite list</h2>
      <p class="verdict" id="sheet-sum"></p>
      <div id="sheet-body"></div>
      <div class="row"><button id="btn-sheet-back" class="primary" type="button">Back</button></div>
    </div>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
